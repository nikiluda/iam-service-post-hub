spring:
  application:
    name: iam_service

  datasource:
    url: jdbc:postgresql://localhost:5432/post_hub_local
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        default_schema: v1_iam_service

    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: v1_iam_service

server:
  servlet:
    context-path: /

  port: 8189

logging:
  level:
    com.post_hub.iam_service: TRACE
    org.springframework.web: debug
    org.flywaydb: debug

    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

end-points:
  create: /create
  id: /{id}
  all: /all
  search: /search
  users: /users
  auth: /auth
  login: /login
  refresh:
    token: /refresh/token
  register: /register
  comments: /comments

jwt:
  secret: AQluFxA7o6Hp+QZq4Q8GxQhjBC49M+a/HBjgob2dUwMroeWlfSxdl3bB/07PQgKlWl6NaJZiAeektuCi/CAuMw==
  lifetime: 3600000
  expiration: 103600000

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  servers:
    - first: http://localhost:8189
      description: Local server